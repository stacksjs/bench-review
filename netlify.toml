# NOTE: deploy target is not finalized — this is the existing Netlify
# config. Whichever host is chosen needs the same four things: run the
# real build command, publish its output, proxy /api/* to the deployed
# API origin, and rewrite the one unbounded dynamic route (below).
#
# Dynamic judge / courthouse / article pages ARE pre-rendered now (the
# `getStaticPaths` hooks in resources/views/**), so the old caveat about
# them having no static output no longer applies.

[build]
base = "/"
# Ends in `bun run build` (= bun build.ts), NOT `./buddy build views`.
# buildApp() alone emits the pages and stops; build.ts is what then splices
# in EIGHT post-build passes the pages are incomplete without — per-page SEO
# head, per-entity SEO + JSON-LD, noindex, self-canonical, ts-analytics, the
# self-hosted webfont, the CSP meta, and sitemap.xml + robots.txt. Deploying
# the framework command alone ships pages missing all of it.
command = "bun install && touch .env && cd storage/framework/core && bun run build && cd ../../.. && bun run build"
# build.ts writes to ./dist (NOT storage/framework/views/web/dist, which is
# empty).
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# The static site calls its API at same-origin /api/* (resources/stores/*
# use relative URLs). In dev the views server proxies this; in production
# nothing does, so every /api call 404s without this proxy. Set the API
# origin (the Bun server) before deploying — replace YOUR-API-HOST.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-HOST/api/:splat"
  status = 200
  force = true

# Email-verification links carry a freshly-minted token, so unlike every other
# dynamic route there is no finite set of pages to pre-render. Without this
# rewrite the link in every signup email resolves to no file and 404s.
#
# Status 200 (a rewrite, not a redirect) so the browser keeps the original URL:
# Bench/VerifyEmail reads the id and token straight off location.pathname.
# Mirrored in preview.ts's SHELL_REWRITES — keep the two in step.
[[redirects]]
  from = "/verify-email/:id/:token"
  to = "/verify-email.html"
  status = 200

[[plugins]]
package = "@netlify/plugin-lighthouse"
