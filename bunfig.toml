# preload these modules before running bun
preload = [ "./storage/framework/defaults/resources/plugins/preloader.ts" ]

[test]
# Scope `bun test` to this app's own tests.
#
# Without it Bun walks node_modules, and `@stacksjs/stx` is a SYMLINK to the
# local stx clone (~/Documents/Projects/stx) — so a bare `bun test` on a
# machine with that fork runs the FRAMEWORK's entire suite instead of
# bench's, takes minutes, and reports failures from another repository. CI
# never saw it because a runner has no symlinked fork; locally it meant
# `bun test` gave no signal about this app at all.
root = "./tests"
preload = [ "./tests/setup.ts" ]
coverage = false

[run]
# equivalent to `bun --bun` for all `bun run` commands
bun = true

[serve.static]
plugins = [ "bun-plugin-stx" ]

[install]
registry = { url = "https://registry.npmjs.org/", token = "$BUN_AUTH_TOKEN" }
linker = "hoisted"
