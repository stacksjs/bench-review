name: BenchReview
options:
  bundleIdPrefix: org.benchreview
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "3JJRNQW6B7"
  configs:
    debug:
      CRAFT_APNS_ENVIRONMENT: development
    release:
      CRAFT_APNS_ENVIRONMENT: production
targets:
  BenchReview:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: dist
        type: folder
        buildPhase: resources
      - path: craft.config.json
        optional: true
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: Craft.entitlements
      PRODUCT_NAME: "$(TARGET_NAME)"
      PRODUCT_BUNDLE_IDENTIFIER: org.benchreview.app
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon




# A shared scheme, so CI (Xcode Cloud, a fresh checkout's xcodebuild) can
# build and archive the app without Xcode first creating a per-user one.
schemes:
  BenchReview:
    build:
      targets:
        BenchReview: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
