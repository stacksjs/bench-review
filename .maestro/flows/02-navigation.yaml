appId: ${APP_ID}
name: Tabs and push navigation
tags:
  - mobile
  - smoke
---
# Moving around the app: the tab bar switches stacks, a row pushes a detail
# screen, and back returns.
#
# This flow used to tap the web header's hamburger and wait for a page
# heading. There is no header and no page now — navigation is the system's,
# and what is worth testing is that the app drives it correctly.
#
# Press handlers are the specific risk. The native runtime registers one ONLY
# when the element carries an `id`, and nothing reports it when one is
# missing: the tap lands, no handler runs, no error is raised, and the screen
# simply stays put. Every tap below is therefore an assertion that an id
# survived the last edit.
#
# ⚠️ `waitForAnimationToEnd` before each push, and it is not decoration. A row
# tapped the instant its text appears can be tapped while the list is still
# settling, and that tap is silently lost — the same symptom as a missing id.
# This flow failed that way in a full run and passed on its own, which is the
# worst kind of test: one that reports a real bug's signature at random.
#
# TAPPING A TAB IS BY POSITION, NOT BY ITS WORD.
#
# The tab bar's labels are not unique on screen: a courthouse's stats row says
# "Judges" and "Reviews" too, and the back button inherits the previous
# screen's title. `tapOn: "Reviews"` matched the stats caption, and the flow
# went on asserting against the screen it was already on.
#
# The five tabs are evenly spaced across the bar, so their centres are stable
# proportions of any screen: Feed 14%, Judges 32%, Courthouses 50%, Write 68%,
# Profile 86%, all at 92% down. Measured from the accessibility tree on an
# iPhone 17 Pro (402x874pt), where the buttons span y 778-832.

- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Ran a tight, fair calendar"
    timeout: 90000

# ⚠️ START FROM SIGNED OUT, and do not assume it.
#
# `clearState: true` wipes the app's own data but NOT the Keychain, which is
# where the session token lives — it survives a reinstall and an erase of app
# storage both. So any earlier run that signed in (or anyone signing in by
# hand) leaves the next run signed in, and a flow asserting the guest state
# fails for a reason that has nothing to do with the change under test.
#
# Measured: this flow went red that way after a sign-in probe, with the app
# behaving perfectly.
- tapOn:
    point: "86%,92%"
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn:
          id: "profile-signout"
      - extendedWaitUntil:
          visible: "You are browsing as a guest"
          timeout: 30000

# Back to the feed to begin.
- tapOn:
    point: "14%,92%"
- extendedWaitUntil:
    visible: "Ran a tight, fair calendar"
    timeout: 30000

# The feed's rows carry sanitiser-escaped HTML. A row that forgot to strip
# tags or decode entities would print the escape rather than the ampersand.
- assertVisible:
    text: ".*Alder & Co.*"
- assertNotVisible: "&amp;"
- takeScreenshot: feed

# ANOTHER TAB IS ANOTHER STACK — the Judges tab.
- tapOn:
    point: "32%,92%"
- extendedWaitUntil:
    visible: "(?i)25 judges"
    timeout: 30000
- takeScreenshot: judges

# A ROW PUSHES ITS JUDGE. The name is the fixture's first row, so this also
# checks the row opened the judge it was showing rather than some other one.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Fixture A. Alder"
- extendedWaitUntil:
    visible: "Write a review"
    timeout: 30000
- assertVisible: "Fixture A. Alder"
- assertVisible: "Fixture County Courthouse"
- assertVisible: "Opinions"
- assertVisible: "Education"

# THE JUDGE'S REVIEWS CARRY THE SAME CHIPS AS THE FEED. They are the same
# rows; a review markable helpful in one place and not the other is a
# difference people notice and cannot explain. The fixture's judge 1 has two
# reviews, the first with 4 likes and 2 comments.
- assertVisible:
    id: "judge-review-like-1000"
- assertVisible:
    id: "judge-review-comments-1000"
- takeScreenshot: judge-detail

# BACK RETURNS TO THE DIRECTORY, with the list still there.
- tapOn:
    point: "6%,10%"
- extendedWaitUntil:
    visible: "(?i)25 judges"
    timeout: 30000
- assertNotVisible: "Write a review"

# THE COURTHOUSES TAB.
- tapOn:
    point: "50%,92%"
- extendedWaitUntil:
    visible: "Fixture County Courthouse"
    timeout: 30000
- assertVisible:
    text: "(?i)3 courthouses"
- takeScreenshot: courthouses

# A COURTHOUSE PUSHES ITS BENCH. Only its own judges are on it, so this
# asserts the bench endpoint filtered rather than returning everyone.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Fixture County Courthouse"
- extendedWaitUntil:
    visible: "THE BENCH"
    timeout: 30000
- assertVisible: "Fixture A. Alder"
- assertNotVisible: "Fixture C. Cedar"
- takeScreenshot: courthouse-bench

# PROFILE IS THE SIGNED-OUT STATE on a fresh install, which is what the
# fixture's 401 produces.
- tapOn:
    point: "86%,92%"
- extendedWaitUntil:
    visible: "You are browsing as a guest"
    timeout: 30000
- assertVisible: "Sign in"
- takeScreenshot: profile-guest
