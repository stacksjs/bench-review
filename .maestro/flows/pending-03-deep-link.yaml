# PENDING — this flow FAILS, and it is kept because it documents a real gap.
#
# `config/mobile.ts` declares `urlSchemes: ['benchreview']`, so iOS registers
# the scheme and hands the URL to the app. The native shell then does nothing
# with it: `benchreview://judges` leaves the WebView on whatever page it was
# already showing. Verified on an iPhone 17 Pro simulator — the app stayed on
# the coming-soon page and the screenshot is in the run output.
#
# The runner skips `pending-*` flows, so the suite stays green on what works.
# Run this one deliberately:
#
#     bun run test:e2e:ios -- --flow=deep-link --include-pending
#
appId: ${APP_ID}
name: Deep link routing (pending)
tags:
  - mobile
  - deep-link
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: Transparency in the US Chambers of Secrets
    timeout: 90000

# The custom scheme, not a universal link. `config/mobile.ts` declares both,
# but `applinks:` needs a signed non-personal team AND the domain serving
# /.well-known/apple-app-site-association (bench-review#80) — neither of which
# a local simulator run has. The scheme works without either, so it is what
# this can honestly assert.
- openLink: benchreview://judges

# iOS may interpose an app-switch confirmation.
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"

- extendedWaitUntil:
    visible: Judicial Directory
    timeout: 30000
- takeScreenshot: deep-link
